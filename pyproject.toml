[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "telegraph-cli"
version = "1.1.0"
description = "Markdown → telegra.ph publisher. Stdlib-only Python 3 CLI."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Дмитрий Зайцев"}]
keywords = ["telegraph", "telegra.ph", "markdown", "publisher", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/dim-s/telegraph-cli"
Issues = "https://github.com/dim-s/telegraph-cli/issues"
Repository = "https://github.com/dim-s/telegraph-cli"

[project.scripts]
telegraph-publish = "telegraph_publish:main"

[tool.setuptools]
py-modules = ["telegraph_publish"]
